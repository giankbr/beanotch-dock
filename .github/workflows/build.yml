name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  # Publishing a release builds the dock at that version and attaches its installers.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") }
                     else { ([xml](Get-Content src/BeanotchDock/BeanotchDock.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
      - name: Publish
        run: dotnet publish src/BeanotchDock/BeanotchDock.csproj -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -p:Version=${{ env.VERSION }} -o out/BeanotchDock
      # Runs the dock on the build machine in its snapshot mode and photographs the desktop with it on screen.
      - name: Snapshots
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: pwsh
        run: .github/scripts/snapshots.ps1 -Out (Join-Path $env:RUNNER_TEMP "snapshots") -Exe out/BeanotchDock/BeanotchDock.exe
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64'
        with:
          name: BeanotchDock-Snapshots
          path: ${{ runner.temp }}/snapshots
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ env.VERSION }} /DArch=${{ matrix.arch }} installer/BeanotchDock.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BeanotchDock-Setup-${{ matrix.arch }}
          path: out/BeanotchDock-Setup-${{ matrix.arch }}.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "out/BeanotchDock-Setup-${{ matrix.arch }}.exe" --clobber --repo ${{ github.repository }}
